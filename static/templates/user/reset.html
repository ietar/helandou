<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>重置密码 -- 荷兰豆</title>
    <link rel="stylesheet" href="/static/css/default.css">

    <script type="text/javascript" src="/static/js/vue.min.js"></script>
    <script type="text/javascript" src="/static/js/jquery-3.4.1.js"></script>
    <script type="text/javascript" src="/static/js/axios0.24.0.js"></script>
    <script type="text/javascript" src="/static/js/pre_common.js"></script>
</head>
<body>
    <div class="header clearfix">
        <div class="container">
            <div class="where_am_i">
                <a href="/">首页</a> >> <a href="/user/reset_password">重置密码</a>
            </div>
            <div class="search_bar" id="search_bar" v-cloak>
                <form action="/search" method="get">
                    <input type="text" class="search_input" :placeholder="search_place_holder" name="q" autocomplete="off">
                    <input type="submit" value="提交">
                </form>
            </div>
            <div class="user_info" id="user_info_bar" v-cloak>
                <div v-if="nickname">
                    <a class="nickname" href="/user/profile">[[ nickname ]]</a>
                    <a id="logout" href="#" @click.prevent="logout">退出</a>
                </div>
                <div v-else>
                    <a id="register" href="/user/register">注册</a>
                    <a id="login" href="/user/login">登录</a>
                </div>
            </div>
        </div>
    </div>
    <div class="header_bottom">
        <form action ='/api/user/reset_password' method="post">
            <input type="hidden" name="reset_password_salt" value="todo">
            <input type="hidden" name="user_id" value="todo">
            <p><label for="password">输入新密码: <input type="password" name='password' id="password" required minlength="8"
                                                  maxlength="20" placeholder="8-20位"></label></p>
            <p>
                <label for="repassword">重复新密码: <input type="password" name='re_password' id="repassword" minlength="8"
                                                    required maxlength="20" placeholder="8-20位" onblur="check()">
                </label>
                <p id="repassword_error_msg" class=""></p>
            </p>
            <script type="text/javascript">function check(){
                if (document.getElementsByName('password')[0].value !== document.getElementsByName('re_password')[0].value) {
                    let msg = document.getElementById('repassword_error_msg');
                    msg.innerText = "您两次输入的密码不一样！请重新输入.";
                    document.getElementById("submit").disabled = true;
                    document.getElementById('repassword').focus();
                }
                else{
                    document.getElementById("submit").disabled = false;
                }
            }
            </script>
            <input type="submit" id="submit" value="更改密码">
            <input type="reset">
        </form>
    </div>
    <script src="/static/js/common.js"></script>
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        const searchParams = new URLSearchParams(window.location.search);
        document.querySelector('input[name="reset_password_salt"]').value = searchParams.get('reset_salt');
        document.querySelector('input[name="user_id"]').value = searchParams.get('id');
    });
    </script>
</body>
</html>
